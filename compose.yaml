name: reservehub

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - reservehub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservehub}
      POSTGRES_USER: ${POSTGRES_USER:-reservehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservehub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - reservehub
      - tenant-internal

  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    command:
      - --jetstream
      - --http_port=8222
      - --store_dir=/data
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITORING_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - reservehub
      - tenant-internal

  auth-service-schema:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-reservehub}
    command:
      - psql
      - --host=postgres
      - --username=${POSTGRES_USER:-reservehub}
      - --dbname=${POSTGRES_DB:-reservehub}
      - --set=ON_ERROR_STOP=1
      - --command=CREATE SCHEMA IF NOT EXISTS auth_service
    networks:
      - reservehub

  auth-service-migrations:
    image: migrate/migrate:v4.20.1
    restart: "no"
    depends_on:
      auth-service-schema:
        condition: service_completed_successfully
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-reservehub}:${POSTGRES_PASSWORD:-reservehub}@postgres:5432/${POSTGRES_DB:-reservehub}?sslmode=disable&search_path=auth_service&x-migrations-table=sys_schema_migration
      - up
    volumes:
      - ./services/auth-service/migrations:/migrations:ro
    networks:
      - reservehub

  auth-service-bootstrap:
    build:
      context: ./services/auth-service
    restart: "no"
    depends_on:
      auth-service-migrations:
        condition: service_completed_successfully
    command: ["bootstrap-admin"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-reservehub}:${POSTGRES_PASSWORD:-reservehub}@postgres:5432/${POSTGRES_DB:-reservehub}?sslmode=disable&search_path=auth_service
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-local}
    networks:
      - reservehub

  auth-service:
    <<: *service-defaults
    # File-backed Compose secrets keep the host file's ownership and mode.
    # Match the local owner so mode-0600 secret files remain private and readable.
    user: "${RESERVEHUB_LOCAL_UID:-1000}:${RESERVEHUB_LOCAL_GID:-1000}"
    build:
      context: ./services/auth-service
    depends_on:
      auth-service-bootstrap:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    environment:
      HTTP_ADDRESS: :8082
      DATABASE_URL: postgres://${POSTGRES_USER:-reservehub}:${POSTGRES_PASSWORD:-reservehub}@postgres:5432/${POSTGRES_DB:-reservehub}?sslmode=disable&search_path=auth_service
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-local}
      AUTH_JWT_PRIVATE_KEY_FILE: /run/secrets/auth_jwt_private_key
      AUTH_PROVISION_SERVICE_TOKEN_FILE: /run/secrets/platform_service_token
      NATS_URL: nats://nats:4222
      AUTH_SMTP_ADDRESS: ${AUTH_SMTP_ADDRESS:-}
      AUTH_SMTP_FROM: ${AUTH_SMTP_FROM:-}
      AUTH_SMTP_USERNAME: ${AUTH_SMTP_USERNAME:-}
      AUTH_SMTP_PASSWORD_FILE: /run/secrets/auth_smtp_password
      AUTH_INVITATION_ENCRYPTION_KEY_FILE: /run/secrets/auth_invitation_encryption_key
      AUTH_INVITATION_LINK_BASE_URL: ${AUTH_INVITATION_LINK_BASE_URL:-}
      AUTH_INVITATION_TTL: ${AUTH_INVITATION_TTL:-48h}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-720h}
    volumes:
      - ${AUTH_SMTP_PASSWORD_HOST_FILE:-/dev/null}:/run/secrets/auth_smtp_password:ro
      - ${AUTH_INVITATION_ENCRYPTION_KEY_HOST_FILE:-/dev/null}:/run/secrets/auth_invitation_encryption_key:ro
    secrets:
      - auth_jwt_private_key
      - platform_service_token
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api-gateway:
    <<: *service-defaults
    build:
      context: ./services/api-gateway
    depends_on:
      auth-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
    environment:
      HTTP_ADDRESS: :8080
      AUTH_SERVICE_URL: http://auth-service:8082
      ADMIN_SERVICE_URL: http://admin-service:8083
      AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/auth_jwt_public_key
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-local}
    secrets:
      - auth_jwt_public_key
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  tenant-service-schema:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-reservehub}
    command:
      - psql
      - --host=postgres
      - --username=${POSTGRES_USER:-reservehub}
      - --dbname=${POSTGRES_DB:-reservehub}
      - --set=ON_ERROR_STOP=1
      - --command=CREATE SCHEMA IF NOT EXISTS tenant_service
    networks:
      - tenant-internal

  tenant-service-migrations:
    image: migrate/migrate:v4.20.1
    restart: "no"
    depends_on:
      tenant-service-schema:
        condition: service_completed_successfully
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-reservehub}:${POSTGRES_PASSWORD:-reservehub}@postgres:5432/${POSTGRES_DB:-reservehub}?sslmode=disable&search_path=tenant_service&x-migrations-table=sys_schema_migration
      - up
    volumes:
      - ./services/tenant-service/migrations:/migrations:ro
    networks:
      - tenant-internal

  tenant-service:
    <<: *service-defaults
    user: "${RESERVEHUB_LOCAL_UID:-1000}:${RESERVEHUB_LOCAL_GID:-1000}"
    build:
      context: ./services/tenant-service
    depends_on:
      tenant-service-migrations:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-reservehub}:${POSTGRES_PASSWORD:-reservehub}@postgres:5432/${POSTGRES_DB:-reservehub}?sslmode=disable&search_path=tenant_service
      NATS_URL: nats://nats:4222
      GRPC_ADDRESS: :8081
      METRICS_ADDRESS: :9091
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-local}
      AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/auth_jwt_public_key
      PLATFORM_SERVICE_TOKEN_FILE: /run/secrets/platform_service_token
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - tenant-internal
    secrets:
      - auth_jwt_public_key
      - platform_service_token

  admin-service-schema:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-reservehub}
    command:
      - psql
      - --host=postgres
      - --username=${POSTGRES_USER:-reservehub}
      - --dbname=${POSTGRES_DB:-reservehub}
      - --set=ON_ERROR_STOP=1
      - --command=CREATE SCHEMA IF NOT EXISTS admin_service
    networks:
      - reservehub

  admin-service-migrations:
    image: migrate/migrate:v4.20.1
    restart: "no"
    depends_on:
      admin-service-schema:
        condition: service_completed_successfully
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-reservehub}:${POSTGRES_PASSWORD:-reservehub}@postgres:5432/${POSTGRES_DB:-reservehub}?sslmode=disable&search_path=admin_service&x-migrations-table=sys_schema_migration
      - up
    volumes:
      - ./services/admin-service/migrations:/migrations:ro
    networks:
      - reservehub

  admin-service:
    <<: *service-defaults
    user: "${RESERVEHUB_LOCAL_UID:-1000}:${RESERVEHUB_LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    depends_on:
      admin-service-migrations:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
    environment:
      HTTP_ADDRESS: :8083
      DATABASE_URL: postgres://${POSTGRES_USER:-reservehub}:${POSTGRES_PASSWORD:-reservehub}@postgres:5432/${POSTGRES_DB:-reservehub}?sslmode=disable&search_path=admin_service
      TENANT_GRPC_ADDRESS: tenant-service:8081
      AUTH_SERVICE_URL: http://auth-service:8082
      NATS_URL: nats://nats:4222
      AUTH_JWT_PUBLIC_KEY_FILE: /run/secrets/auth_jwt_public_key
      PLATFORM_SERVICE_TOKEN_FILE: /run/secrets/platform_service_token
    networks:
      - reservehub
      - tenant-internal
    secrets:
      - auth_jwt_public_key
      - platform_service_token
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  nats_data:

secrets:
  auth_jwt_private_key:
    file: ${AUTH_JWT_PRIVATE_KEY_FILE:-./secrets/auth-jwt-private.pem}
  auth_jwt_public_key:
    file: ${AUTH_JWT_PUBLIC_KEY_FILE:-./secrets/auth-jwt-public.pem}
  platform_service_token:
    file: ${PLATFORM_SERVICE_TOKEN_FILE:-./secrets/platform-service-token}

networks:
  reservehub:
    driver: bridge
  tenant-internal:
    driver: bridge
    internal: true
