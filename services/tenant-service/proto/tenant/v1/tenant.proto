syntax = "proto3";

package reservehub.tenant.v1;

option go_package = "darksamus.com/ReserveHub/tenant-service/gen/tenant/v1;tenantv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service TenantService {
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (Tenant);

  rpc ActivateTenant(ChangeTenantStateRequest) returns (Tenant);
  rpc SuspendTenant(ChangeTenantStateRequest) returns (Tenant);
  rpc ResumeTenant(ChangeTenantStateRequest) returns (Tenant);
  rpc ArchiveTenant(ChangeTenantStateRequest) returns (Tenant);

  rpc GetTenantSettings(GetTenantSettingsRequest) returns (TenantSettings);
  rpc UpdateTenantSettings(UpdateTenantSettingsRequest) returns (TenantSettings);

  rpc GetCurrentPlan(GetCurrentPlanRequest) returns (TenantPlan);
  rpc GetPlanHistory(GetPlanHistoryRequest) returns (GetPlanHistoryResponse);
  rpc ChangeTenantPlan(ChangeTenantPlanRequest) returns (TenantPlan);

  rpc GetEffectiveLimit(GetEffectiveLimitRequest) returns (EffectiveLimit);
  rpc SetTenantLimitOverride(SetTenantLimitOverrideRequest) returns (TenantLimitOverride);
  rpc RemoveTenantLimitOverride(RemoveTenantLimitOverrideRequest) returns (google.protobuf.Empty);

  rpc HasFeature(HasFeatureRequest) returns (EffectiveFeature);
  rpc GetEffectiveFeatures(GetEffectiveFeaturesRequest) returns (EffectiveFeatures);
  rpc SetTenantFeatureOverride(SetTenantFeatureOverrideRequest) returns (TenantFeatureOverride);
  rpc RemoveTenantFeatureOverride(RemoveTenantFeatureOverrideRequest) returns (google.protobuf.Empty);

  rpc AddTenantDomain(AddTenantDomainRequest) returns (TenantDomain);
  rpc GetTenantDomains(GetTenantDomainsRequest) returns (GetTenantDomainsResponse);
  rpc VerifyTenantDomain(VerifyTenantDomainRequest) returns (TenantDomain);
  rpc SetPrimaryTenantDomain(SetPrimaryTenantDomainRequest) returns (TenantDomain);
  rpc DisableTenantDomain(DisableTenantDomainRequest) returns (TenantDomain);

  rpc GetTenantBranding(GetTenantBrandingRequest) returns (TenantBranding);
  rpc UpdateTenantBranding(UpdateTenantBrandingRequest) returns (TenantBranding);
}

message Tenant {
  string id = 1;
  string name = 2;
  string slug = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp activated_at = 7;
  google.protobuf.Timestamp suspended_at = 8;
  google.protobuf.Timestamp archived_at = 9;
}

message TenantSettings {
  string tenant_id = 1;
  string timezone = 2;
  string currency_code = 3;
  string locale_code = 4;
  string default_language = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message SubscriptionPlan {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  bool is_active = 5;
}

message TenantPlan {
  string id = 1;
  string tenant_id = 2;
  SubscriptionPlan plan = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  google.protobuf.Timestamp created_at = 6;
}

message EffectiveLimit {
  string tenant_id = 1;
  string code = 2;
  int64 value = 3;
  bool overridden = 4;
}

message TenantLimitOverride {
  string id = 1;
  string tenant_id = 2;
  string limit_code = 3;
  int64 value = 4;
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message EffectiveFeature {
  string tenant_id = 1;
  string code = 2;
  bool enabled = 3;
  bool overridden = 4;
}

message EffectiveFeatures {
  string tenant_id = 1;
  repeated EffectiveFeature features = 2;
}

message TenantFeatureOverride {
  string id = 1;
  string tenant_id = 2;
  string feature_code = 3;
  bool enabled = 4;
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message TenantDomain {
  string id = 1;
  string tenant_id = 2;
  string domain = 3;
  string status = 4;
  bool is_primary = 5;
  string verification_token = 6;
  google.protobuf.Timestamp verified_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message TenantBranding {
  string tenant_id = 1;
  string status = 2;
  string display_name = 3;
  string logo_url = 4;
  string favicon_url = 5;
  string primary_color = 6;
  string secondary_color = 7;
  string accent_color = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateTenantRequest {
  string name = 1;
  string slug = 2;
  string timezone = 3;
  string currency_code = 4;
  string locale_code = 5;
  string default_language = 6;
  string plan_id = 7;
  // Stable ID of the platform provisioning command. Retries with the same ID
  // and different tenant data are rejected.
  string operation_id = 8;
}

message GetTenantRequest { string tenant_id = 1; }

message ListTenantsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string status = 3;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_page_token = 2;
}

message UpdateTenantRequest {
  string tenant_id = 1;
  optional string name = 2;
  optional string slug = 3;
}

message ChangeTenantStateRequest { string tenant_id = 1; }

message GetTenantSettingsRequest { string tenant_id = 1; }

message UpdateTenantSettingsRequest {
  string tenant_id = 1;
  string timezone = 2;
  string currency_code = 3;
  string locale_code = 4;
  string default_language = 5;
}

message GetCurrentPlanRequest { string tenant_id = 1; }
message GetPlanHistoryRequest { string tenant_id = 1; }
message GetPlanHistoryResponse { repeated TenantPlan plans = 1; }

message ChangeTenantPlanRequest {
  string tenant_id = 1;
  string plan_id = 2;
  google.protobuf.Timestamp effective_from = 3;
}

message GetEffectiveLimitRequest {
  string tenant_id = 1;
  string limit_code = 2;
}

message SetTenantLimitOverrideRequest {
  string tenant_id = 1;
  string limit_code = 2;
  int64 value = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
}

message RemoveTenantLimitOverrideRequest {
  string tenant_id = 1;
  string override_id = 2;
}

message HasFeatureRequest {
  string tenant_id = 1;
  string feature_code = 2;
}

message GetEffectiveFeaturesRequest { string tenant_id = 1; }

message SetTenantFeatureOverrideRequest {
  string tenant_id = 1;
  string feature_code = 2;
  bool enabled = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
}

message RemoveTenantFeatureOverrideRequest {
  string tenant_id = 1;
  string override_id = 2;
}

message AddTenantDomainRequest {
  string tenant_id = 1;
  string domain = 2;
}

message GetTenantDomainsRequest { string tenant_id = 1; }
message GetTenantDomainsResponse { repeated TenantDomain domains = 1; }

message VerifyTenantDomainRequest {
  string tenant_id = 1;
  string domain_id = 2;
  string verification_token = 3;
}

message SetPrimaryTenantDomainRequest {
  string tenant_id = 1;
  string domain_id = 2;
}

message DisableTenantDomainRequest {
  string tenant_id = 1;
  string domain_id = 2;
}

message GetTenantBrandingRequest { string tenant_id = 1; }

message UpdateTenantBrandingRequest {
  string tenant_id = 1;
  string display_name = 2;
  string logo_url = 3;
  string favicon_url = 4;
  string primary_color = 5;
  string secondary_color = 6;
  string accent_color = 7;
}
